<!DOCTYPE html>
<html>
<head>
	<!-- This title is used for tabs and bookmarks -->
	<title>CMPM 169 Prototype</title>

	<!-- Use UTF character set, a good idea with any webpage -->
  	<meta charset="UTF-8" />
	<!-- Set viewport so page remains consistently scaled w narrow devices -->
  	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	
	<!-- Include a sitewide CSS file for consistent styling across the site -->
	<!--<link rel="stylesheet" type="text/css" href="../css/site.css"> uncomment when implementing into page-->
	<!-- Lab-specifc CSS file for any special styling of this particular page -->
	<link rel="stylesheet" type="text/css" href="css/lab.css">
	
	<!-- load jQuery library to make javascript easier (must be above our lab js)-->
	<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
	<script src="./lib/phaser.js"></script>
	<script src="./Scenes/Gallery.js"></script>
	<!-- Link to javascript file - DEFER waits until all elements are rendered -->
	<script src="./js/lab.js"></script>

	<!-- FireBase API -->
	<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
	<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

</head>
<body>
	<main id="content">

		<h2>received emotions</h2>

		<!-- User Input Field -->
		 <label for="user">Username:</label>
		 <input type="text" id ="user" placeholder="Enter your username" />

		<!-- Message Input Field -->
		 <label for="message">Message:</label>
		 <textarea id="message" placeholder="Type your message"></textarea>

		<!-- Submit Button -->
		 <button id="send-btn">Send Message</button>

		<!-- Emotion Display -->
		 <div id="emotion-container" class="hidden">
			<p><strong>Emotion Detected:</strong> <span id="emotion"></span></p>
		 </div>

		<!-- Firebase message display -->
		 <div id="messages-container">
			<h3>Messages:</h3>
			<div id="messages-list"></div>
		 </div>

		<section id="main-container">

			<!-- Center Container for Phaser -->
			<div id="phaser-container">
				<!-- Phaser Game Will Be Rendered Here -->
			</div>

		</section>

		<nav id="links"></nav>
	</main>

	
	<script type="module" src="./js/open-ai.js"></script>
	<script type="module" src="./js/firebase.js"></script>
	<script type="module" src="./js/front-end.js"></script>
</body>
</html>
